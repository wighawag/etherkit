name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22]

    steps:
      - name: Set up foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        # NO `version` input: the action reads `packageManager` from the root
        # package.json. Setting both fails with ERR_PNPM_BAD_PM_VERSION as soon
        # as they disagree.
        uses: pnpm/action-setup@v5

      - name: Setup Node ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --ignore-scripts

      - name: build packages
        run: pnpm build

      # The published .d.ts files must only import packages declared in
      # dependencies or peerDependencies (a devDependency is invisible to consumers).
      - name: Published types declare their imports
        run: pnpm check:type-deps

      - name: Typecheck (includes type-level tests)
        run: pnpm typecheck

      - name: Run tests
        run: pnpm test
