name: release

# Changesets release flow:
#   1. Land PRs that include a changeset (`.changeset/*.md`) on main.
#   2. This workflow opens/updates a "Version Packages" PR that bumps versions
#      and updates changelogs from the pending changesets.
#   3. Merging that PR (which removes the changesets) makes this workflow run
#      `changeset publish`, publishing the changed packages to npm.
#
# Auth is npm Trusted Publishing (OIDC): NO NPM_TOKEN secret. npm trusts this
# repo + workflow (release.yml) via the trusted publisher registered on each
# package's npmjs.com settings. The OIDC handshake needs `id-token: write`,
# Node >= 22 (npm CLI >= 11.5.1), and pnpm 10.x; publishes are stamped with
# provenance.
#
# One-time setup, per package: every published package (@etherkit/tx-observer,
# @etherkit/burner-wallet, @etherkit/viem-tx-tracker) needs its own trusted
# publisher entry on npmjs.com pointing at this repo and this workflow
# filename. All three already exist on npm (published by hand before this
# workflow), which matters: OIDC cannot publish the FIRST version of a package
# (npm/cli#8544), so a NEW package added later needs one manual publish first.
# A package without the entry fails to publish with an auth error; re-run this
# workflow (workflow_dispatch) once the entry is added.
on:
  push:
    branches: [main]
  # Manual trigger from the Actions tab, e.g. to (re-)run the Version-PR / publish
  # step after a merge that did not emit a push event (a GITHUB_TOKEN API merge
  # does not trigger `on: push`), or to re-publish idempotently.
  workflow_dispatch: {}

# Serialize release runs on main, but NEVER cancel an in-progress one:
# `changeset publish` may be mid-publish, and cancelling it would drop the
# release. `changeset publish` is idempotent (it skips versions already on npm),
# so letting each queued run finish is always safe.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  id-token: write # npm provenance

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # The tests run against a local anvil node, as in test.yml.
      - name: Set up foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        # NO `version` input: the action reads `packageManager` from the root
        # package.json. Setting both fails with ERR_PNPM_BAD_PM_VERSION.
        uses: pnpm/action-setup@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24 # >= 22 required for npm OIDC trusted publishing
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install
        run: pnpm install --frozen-lockfile --ignore-scripts

      # Publishing is gated on the type tests and the tests, not only on the
      # build: same commands as test.yml.
      - name: Build, typecheck and test
        run: pnpm build && pnpm typecheck && pnpm test

      - name: Create Release PR or Publish
        uses: changesets/action@v1
        with:
          # release:ci runs prepublishOnly (format check, build, published type
          # imports check) then `changeset publish` (the action itself handles
          # git commits/tags, so no git push here). No NPM_TOKEN: npm detects the
          # OIDC environment and authenticates via the registered trusted
          # publisher.
          publish: pnpm release:ci
          version: pnpm changeset version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
